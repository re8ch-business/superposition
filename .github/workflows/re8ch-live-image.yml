name: RE8CH production image

on:
  push:
    branches: [re8ch-v0.112.0]
    paths:
      - '.github/workflows/re8ch-live-image.yml'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'crates/**'
      - 'workspace_template.sql'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/re8ch-business/superposition:re8ch-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/re8ch-business/superposition
          provenance: true
          sbom: true
